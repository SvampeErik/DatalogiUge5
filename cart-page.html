<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Dette gør siden responsiv, så størrelsen tilpasses skærmen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!--Titlen på hjemmesiden-->
    <title>Shabstore</title>
    <!-- Forbinder HTML-siden med vores CSS-fil -->
    <link rel="stylesheet" href="cart-page.css">
</head>
<body>
<header class="navbar">
       <!-- Navn på vores webshop -->
    <a href="#" class="logo">Shabstore</a>

     <!-- Container til kurv-knappen og selve kurven -->
    <div class="cart-wrapper">

         <!-- Kurv-knap.
             cart-count ændres dynamisk med JavaScript -->
        <button id="cart-button">🛒 Kurv <span id="cart-count">0</span></button>

         <!-- Selve kurven. Klassen "hidden" gør, at den starter med at være skjult -->
        <aside id="cart" class="hidden">
            <h2>Kurv</h2>

             <!-- Her indsætter JavaScript varerne dynamisk -->
            <ul id="cart-items"></ul>
               <!-- Her indsætter JavaScript kurvens samlede pris -->
            <p>Total: <span id="cart-total">0</span> kr</p>
        </aside>
    </div>
</header>

<!-- SØGEFELT -->
<div class="search">

        <!-- Inputfelt hvor brugeren kan skrive sin søgning. JavaScript finder feltet gennem id="searchInput" -->
    <input type="text" id="searchInput" placeholder="Søg efter varer...">
     <!-- Søgeknap -->
     <button type="submit">Søg</button>
</div>

<!-- PRODUKT-GRID -->
 <!-- Dette element starter tomt. JavaScript henter produkterne fra vores data og indsætter dem dynamisk her -->
<main class="parent" id="product-grid"></main>

<!-- Dette element starter tomt. JavaScript henter produkterne fra vores data og indsætter dem dynamisk her -->

<!-- Indeholder vores statiske produktdata -->
<script src="cart-page-data.js"></script>

<!-- Indeholder funktionerne til bl.a. produkter, kurv og søgefunktion -->
<script src="cart-page.js"></script>

</body>
</html>
